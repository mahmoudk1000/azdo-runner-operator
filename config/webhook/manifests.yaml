---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-kara-felukka-org-v1-runnerpool
  failurePolicy: Fail
  name: mrunnerpool-v1.kb.io
  rules:
  - apiGroups:
    - kara.felukka.org
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - runnerpools
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-kara-felukka-org-v1-runnerpool
  failurePolicy: Fail
  name: vrunnerpool-v1.kb.io
  rules:
  - apiGroups:
    - kara.felukka.org
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - runnerpools
  sideEffects: None
